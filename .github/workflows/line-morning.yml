name: Morning LINE digest

# The PC builds the digest and commits line-latest.txt (+ line-date.txt) to this repo.
# This workflow does a LINE send; it is TRIGGERED by workflow_dispatch.
#
# ★2026-08-07: THIS IS NO LONGER THE ONLY SENDER. The Cloudflare Worker lsm-scheduler now
# sends the same digest itself at 07:13 JST from a copy the PC parks with it, because GitHub
# took the delivery down twice in three weeks (Pages in late July; Actions+Pages on 08-07).
# Either side alone delivers. Exactly one message still reaches the 24-person staff group,
# enforced at three levels:
#   1. this job asks the Worker whether the same content was already delivered (fail-open),
#   2. it scans its own recent run logs for the same sha (below),
#   3. both senders use the SAME X-Line-Retry-Key, so LINE answers 409 to the second arrival.
# ★The key is sha256(line-date || line-latest) over the bytes IN THIS REPO (LF). The PC's
# working copy is CRLF (core.autocrlf=true) and hashes differently - the Worker normalises
# to LF for exactly this reason. Change the digest here and you must change it there.
#
# WHO DISPATCHES IT: the Cloudflare Worker `lsm-scheduler` (code\tools\cf-scheduler\),
# cron 13 22 * * * UTC = 07:13 JST, calls the workflow_dispatch API. That Worker is the
# live morning trigger and it is deployed (verified firing 2026-07-17 07:13 JST).
#
# The vestigial GitHub `schedule:` block was removed 2026-07-16: it fired ZERO times ever
# across both repos (even off-the-hour at '13 22' / '33 20'), and a schedule that never
# starts cannot fail, so nothing alerts. Do NOT re-add a schedule here -- dispatch is the
# mechanism that actually works. 正本 = code\tools\cf-scheduler\README.md.

on:
  workflow_dispatch: {}     # the only trigger; the Cloudflare Worker lsm-scheduler calls it

permissions:
  contents: read
  actions: read     # the already-delivered check reads this workflow's own run history

# Never let two sends overlap (e.g. a late cron firing while carriers-pipeline.ps1
# dispatches a CATCH-UP send). This does not stop *sequential* duplicates - the
# already-delivered check below does that.
concurrency:
  group: line-morning-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send digest to LINE group
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cloudflare sends this digest too (see the note above). This token lets us ask
          # whether it already went out, and report back when we are the one who sent it.
          # It matters more here than for econ: a duplicate goes to 24 colleagues.
          INTAKE_TOKEN: ${{ secrets.LINE_INTAKE_EXPORT_TOKEN }}
          INTAKE_BASE: https://lsm-line-intake.hacadr.workers.dev
        run: |
          set -euo pipefail
          if [ -z "${LINE_CHANNEL_TOKEN:-}" ] || [ -z "${LINE_GROUP_ID:-}" ]; then
            echo "Secrets LINE_CHANNEL_TOKEN / LINE_GROUP_ID are not set"; exit 1
          fi
          # Staleness guard: only send if the digest was built today or yesterday (JST),
          # so a PC that was off for days does not blast old news as if it were fresh.
          today=$(TZ=Asia/Tokyo date +%F)
          yday=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
          d=$(cat line-date.txt 2>/dev/null || echo "")
          if [ "$d" != "$today" ] && [ "$d" != "$yday" ]; then
            echo "line-date='$d' is stale (today=$today); skipping send"
            echo "NOT_DELIVERED reason=stale date=$d"
            exit 0
          fi
          # Fresh date but no payload = broken state, NOT "nothing to do". Fail loudly:
          # exiting 0 here is what lets a non-delivery masquerade as a green run.
          if [ ! -f line-latest.txt ]; then
            echo "line-date='$d' is fresh but line-latest.txt is missing - inconsistent state"
            exit 1
          fi
          # Hash date+content so an identical digest on a different day still gets its own
          # key. Derive a v4-shaped UUID from it: LINE's X-Line-Retry-Key makes the send
          # idempotent SERVER-side for 24h, which closes the duplicate window that the
          # log-based guard below cannot (racing runs, log read failure).
          full=$( { cat line-date.txt; cat line-latest.txt; } | sha256sum | cut -c1-32 )
          sha=${full:0:12}
          retry_key="${full:0:8}-${full:8:4}-4${full:13:3}-a${full:17:3}-${full:20:12}"

          # Cross-platform duplicate guard (2026-08-07): Cloudflare sends this same digest at
          # 07:13 too. Ask its receipt table first - one cheap request, versus the run-log scan
          # below which downloads whole logs.
          # FAIL OPEN on purpose: if the Worker is unreachable we send anyway. A duplicate is
          # still caught by the retry key (409), whereas staying silent because a *monitoring*
          # endpoint was down would be a missed delivery caused by the safety net itself.
          if [ -n "${INTAKE_TOKEN:-}" ]; then
            state=$(curl -sS --connect-timeout 5 --max-time 15 \
              -H "Authorization: Bearer $INTAKE_TOKEN" \
              -H "User-Agent: lsm-line-morning/1.0" \
              "$INTAKE_BASE/delivery?target=carrier&sha=$sha" 2>/dev/null || echo "")
            if [ "$(printf '%s' "$state" | jq -r '.delivered // false' 2>/dev/null || echo false)" = "true" ]; then
              by=$(printf '%s' "$state" | jq -r '.receipt.sender // "cloudflare"' 2>/dev/null || echo cloudflare)
              echo "digest sha=$sha was already delivered by $by; skipping duplicate send"
              echo "NOT_DELIVERED reason=already-delivered-$by sha=$sha"
              exit 0
            fi
          else
            echo "note: LINE_INTAKE_EXPORT_TOKEN not set - cannot check the Cloudflare receipt"
          fi

          # Sequential-duplicate guard: if an earlier run today already delivered THIS exact
          # digest, do not send it again (late cron + CATCH-UP dispatch would otherwise
          # double-post to the group).
          since=$(date -u -d "$today 00:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
          for rid in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/line-morning.yml/runs?per_page=30&status=success" \
                       | jq -r --arg since "$since" '.workflow_runs[] | select(.created_at >= $since) | .id'); do
            if [ "$rid" = "${GITHUB_RUN_ID:-}" ]; then continue; fi
            if gh run view "$rid" --repo "$GITHUB_REPOSITORY" --log 2>/dev/null | grep -q "DELIVERED_OK sha=$sha"; then
              echo "digest sha=$sha was already delivered by run $rid; skipping duplicate send"
              echo "NOT_DELIVERED reason=already-delivered sha=$sha"
              exit 0
            fi
          done

          jq -Rs --arg to "$LINE_GROUP_ID" \
            '{to:$to, messages:[{type:"text", text:.}]}' line-latest.txt > payload.json
          code=$(curl -sS --connect-timeout 10 --max-time 60 -o resp.json -w "%{http_code}" -X POST \
            https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_CHANNEL_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Line-Retry-Key: $retry_key" \
            --data @payload.json)
          echo "LINE push HTTP $code"; cat resp.json || true
          # 409 = "The retry key is already accepted": LINE suppressed a duplicate of THIS
          # digest (key is valid 24h). The group already has it, so this is delivered, not
          # a failure - verified live against the real API on 2026-07-15.
          if [ "$code" != "200" ] && [ "$code" != "409" ]; then
            exit 1
          fi
          if [ "$code" = "409" ]; then
            echo "LINE deduplicated a duplicate send (retry key already accepted)"
          fi
          # Tell Cloudflare we delivered it, so its 07:13 send stays quiet and the PC's
          # liveness check can answer "was it delivered?" without reading GitHub run logs -
          # which is exactly what it cannot do when GitHub is the thing that is down.
          if [ -n "${INTAKE_TOKEN:-}" ]; then
            curl -sS --connect-timeout 5 --max-time 15 -X POST "$INTAKE_BASE/delivery" \
              -H "Authorization: Bearer $INTAKE_TOKEN" \
              -H "Content-Type: application/json" \
              -H "User-Agent: lsm-line-morning/1.0" \
              -d "{\"target\":\"carrier\",\"sha\":\"$sha\",\"date\":\"$d\",\"sender\":\"github\",\"status\":$code}" \
              >/dev/null 2>&1 || echo "warning: could not record the receipt with Cloudflare"
          fi
          # Machine-readable receipt. The watchdog greps THIS, not the run conclusion,
          # because a skipped run is also "success".
          echo "DELIVERED_OK sha=$sha date=$d"

      - name: Alert owner on failure
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          [ -z "${LINE_CHANNEL_TOKEN:-}" ] && exit 0
          [ -z "${LINE_USER_ID:-}" ] && exit 0
          jq -n --arg to "$LINE_USER_ID" \
            --arg text "[LSM自動配信] 朝のキャリアダイジェスト配信に失敗しました（GitHub Actions）。Runログを確認してください。" \
            '{to:$to, messages:[{type:"text", text:$text}]}' > alert.json
          # Check the HTTP status: `curl ... || true` exits 0 on 401/429/500, so the old
          # version printed "alert sent" even when the owner was never actually notified.
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o aresp.json -w "%{http_code}" \
            -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_CHANNEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data @alert.json) || code="000"
          cat aresp.json 2>/dev/null || true
          if [ "$code" = "200" ]; then
            echo "failure alert delivered to owner"
          else
            # LINE itself is the thing that is broken -> this alert path shares its fate.
            echo "::error::failure alert could NOT be delivered (LINE HTTP $code) - owner was NOT notified"
          fi
